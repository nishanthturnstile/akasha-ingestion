name: akasha-ingestion

x-app-env: &app-env
  AKASHA_ENVIRONMENT: ${AKASHA_ENVIRONMENT:-dev}
  AKASHA_RUNTIME_BACKEND: external
  AKASHA_TASK_ALWAYS_EAGER: ${AKASHA_TASK_ALWAYS_EAGER:-false}
  AKASHA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-akasha}:${POSTGRES_PASSWORD:-akasha}@postgres:5432/${POSTGRES_DB:-akasha}
  AKASHA_REDIS_URL: redis://redis:6379/0
  AKASHA_MINIO_ENDPOINT: minio:9000
  AKASHA_MINIO_BUCKET: ${AKASHA_MINIO_BUCKET:-akasha-data}
  AKASHA_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-akasha}
  AKASHA_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me}
  AKASHA_API_KEY_HASHES: ${AKASHA_API_KEY_HASHES:-}
  AKASHA_AOI_GEOJSON_PATH: /app/docs/phase-0/bangalore-aoi.geojson
  AKASHA_EARTHSEARCH_API_URL: ${AKASHA_EARTHSEARCH_API_URL:-https://earth-search.aws.element84.com/v1}
  AKASHA_EARTHSEARCH_TIMEOUT_SECONDS: ${AKASHA_EARTHSEARCH_TIMEOUT_SECONDS:-30}
  AKASHA_EARTHSEARCH_PAGE_SIZE: ${AKASHA_EARTHSEARCH_PAGE_SIZE:-100}
  AKASHA_SOURCE_MIRROR_MODE: ${AKASHA_SOURCE_MIRROR_MODE:-aoi_clipped}
  AKASHA_SOURCE_MIRROR_MAX_BYTES_PER_RUN: ${AKASHA_SOURCE_MIRROR_MAX_BYTES_PER_RUN:-}
  AKASHA_SOURCE_MIRROR_REQUIRED_HEADROOM_BYTES: ${AKASHA_SOURCE_MIRROR_REQUIRED_HEADROOM_BYTES:-0}
  AKASHA_ENABLE_LANDSAT_REQUESTER_PAYS: ${AKASHA_ENABLE_LANDSAT_REQUESTER_PAYS:-false}
  AKASHA_AWS_REGION: ${AKASHA_AWS_REGION:-us-west-2}
  AKASHA_SIGNING_SECRET: ${AKASHA_SIGNING_SECRET:-change-me}
  AKASHA_SIGNED_URL_TTL_SECONDS: ${AKASHA_SIGNED_URL_TTL_SECONDS:-900}
  AKASHA_SCRATCH_DIR: /tmp/akasha
  AKASHA_GDAL_CACHEMAX_MB: ${AKASHA_GDAL_CACHEMAX_MB:-512}
  AKASHA_FIELD_MAX_VERTICES: ${AKASHA_FIELD_MAX_VERTICES:-5000}
  AKASHA_FIELD_MAX_AREA_SQ_KM: ${AKASHA_FIELD_MAX_AREA_SQ_KM:-25}
  AKASHA_FIELD_MIN_USABLE_PIXELS: ${AKASHA_FIELD_MIN_USABLE_PIXELS:-1}
  AKASHA_MAX_CANDIDATE_SCENES: ${AKASHA_MAX_CANDIDATE_SCENES:-20}
  AKASHA_BACKFILL_SEARCH_ITEM_CAP: ${AKASHA_BACKFILL_SEARCH_ITEM_CAP:-1000}
  AKASHA_FIELD_USABLE_PIXEL_THRESHOLD: ${AKASHA_FIELD_USABLE_PIXEL_THRESHOLD:-0.80}
  AKASHA_FIELD_MAX_CLOUD_PERCENTAGE: ${AKASHA_FIELD_MAX_CLOUD_PERCENTAGE:-20}
  AKASHA_SENTINEL2_PROFILE_VERSION: ${AKASHA_SENTINEL2_PROFILE_VERSION:-sentinel2-l2a-earthsearch-v1}
  AKASHA_SELECTION_POLICY_VERSION: ${AKASHA_SELECTION_POLICY_VERSION:-field-selection-v1}
  AKASHA_LIVE_PROVIDER_TESTS: ${AKASHA_LIVE_PROVIDER_TESTS:-false}
  GDAL_CACHEMAX: ${AKASHA_GDAL_CACHEMAX_MB:-512}
  GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
  CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif,.tiff

x-app-volumes: &app-volumes
  - ${AKASHA_DATA_ROOT:-/srv/akasha}/scratch:/tmp/akasha

services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [edge, internal]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  migrate:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    command: ["alembic", "upgrade", "head"]
    profiles: ["tools"]
    environment: *app-env
    depends_on:
      pgstac-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks: [internal]

  pgstac-migrate:
    image: ghcr.io/stac-utils/pgstac:v0.7.10
    command:
      - sh
      - -lc
      - |
        if psql -X -q -tAc "SELECT 1 FROM pg_namespace WHERE nspname = 'pgstac'" | grep -q 1; then
          echo "pgSTAC already initialized"
        else
          /opt/bin/initpgstac
        fi
    profiles: ["tools"]
    environment:
      PGSTACDOCKER: "1"
      PGHOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-akasha}
      PGDATABASE: ${POSTGRES_DB:-akasha}
      PGUSER: ${POSTGRES_USER:-akasha}
      PGPASSWORD: ${POSTGRES_PASSWORD:-akasha}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  seed:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    command: ["python", "-m", "akasha.catalog.seed_db"]
    profiles: ["tools"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  scheduler:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    command:
      [
        "celery",
        "-A",
        "akasha.jobs.celery_app.celery_app",
        "beat",
        "--loglevel=INFO",
      ]
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal]

  worker-search:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    command:
      [
        "celery",
        "-A",
        "akasha.jobs.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "-Q",
        "search,maintenance",
      ]
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal]

  worker-download:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    command:
      [
        "celery",
        "-A",
        "akasha.jobs.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "-Q",
        "download",
      ]
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal]

  worker-process:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    command:
      [
        "celery",
        "-A",
        "akasha.jobs.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "-Q",
        "preprocess,cog,stats",
      ]
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal]

  worker-heavy:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    command:
      [
        "celery",
        "-A",
        "akasha.jobs.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "-Q",
        "heavy-cpu",
        "--concurrency=1",
      ]
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal]

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-akasha}
      POSTGRES_USER: ${POSTGRES_USER:-akasha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-akasha}
    volumes:
      - ${AKASHA_DATA_ROOT:-/srv/akasha}/postgres:/var/lib/postgresql/data
      - postgres-run:/var/run/postgresql
    networks: [internal]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-akasha} -d ${POSTGRES_DB:-akasha}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${AKASHA_DATA_ROOT:-/srv/akasha}/redis:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-akasha}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    volumes:
      - ${AKASHA_DATA_ROOT:-/srv/akasha}/minio:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

  titiler:
    image: ghcr.io/stac-utils/titiler-pgstac:1.8.0
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-akasha}:${POSTGRES_PASSWORD:-akasha}@postgres:5432/${POSTGRES_DB:-akasha}
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_S3_ENDPOINT: minio:9000
      AWS_HTTPS: "NO"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-akasha}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change-me}
      AWS_VIRTUAL_HOSTING: "FALSE"
      GDAL_CACHEMAX: ${AKASHA_GDAL_CACHEMAX_MB:-512}
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif,.tiff
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [internal]

  caddy:
    image: caddy:2.8-alpine
    ports:
      - "${AKASHA_HTTP_PORT:-8080}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${AKASHA_DATA_ROOT:-/srv/akasha}/caddy/data:/data
      - ${AKASHA_DATA_ROOT:-/srv/akasha}/caddy/config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [edge, internal]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${AKASHA_DATA_ROOT:-/srv/akasha}/monitoring/prometheus:/prometheus
    networks: [internal]

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks: [internal]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-akasha}:${POSTGRES_PASSWORD:-akasha}@postgres:5432/${POSTGRES_DB:-akasha}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  redis-exporter:
    image: oliver006/redis_exporter:v1.63.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro
    networks: [internal]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [internal]

  grafana:
    image: grafana/grafana:11.2.0
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ${AKASHA_DATA_ROOT:-/srv/akasha}/monitoring/grafana:/var/lib/grafana
    networks: [internal]

  loki:
    image: grafana/loki:3.2.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - ${AKASHA_DATA_ROOT:-/srv/akasha}/monitoring/loki:/loki
    networks: [internal]

  promtail:
    image: grafana/promtail:3.2.0
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks: [internal]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [internal]

  flower:
    image: mher/flower:2.0
    command:
      ["celery", "--broker=redis://redis:6379/0", "flower", "--port=5555"]
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal]

  pgbackrest:
    build:
      context: ..
      dockerfile: docker/pgbackrest.Dockerfile
    profiles: ["backup"]
    volumes:
      - ./pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ${AKASHA_DATA_ROOT:-/srv/akasha}/backups/pgbackrest:/var/lib/pgbackrest
      - ${AKASHA_DATA_ROOT:-/srv/akasha}/postgres:/var/lib/postgresql/data:ro
      - postgres-run:/var/run/postgresql:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

networks:
  edge:
  internal:
    internal: true

volumes:
  postgres-run:
