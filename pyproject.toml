[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akasha-ingestion"
version = "0.1.0"
description = "Core platform foundation for the Akasha satellite ingestion backend"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "celery>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "h5py>=3.11,<4",
  "minio>=7.2,<8",
  "numpy>=1.26,<3",
  "prometheus-client>=0.20,<1",
  "psycopg[binary]>=3.2,<4",
  "pypgstac>=0.9,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pyproj>=3.6,<4",
  "pystac>=1.10,<2",
  "pystac-client>=0.8,<1",
  "python-json-logger>=2.0,<4",
  "rasterio>=1.3,<2",
  "redis>=5,<6",
  "rio-cogeo>=5.3,<6",
  "shapely>=2.0,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
